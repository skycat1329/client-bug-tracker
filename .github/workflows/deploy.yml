name: Auto Deploy to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger button in GitHub Actions tab anytime

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: |
          npm --prefix frontend ci || npm --prefix frontend install

      - name: 🔨 Compile React Production Frontend
        run: |
          npm --prefix frontend run build

      - name: 📦 Package Hostinger Files
        run: |
          node scripts/package-hostinger.js

      - name: 🚀 Sync Files to Hostinger (FTP Auto-Deploy)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          local-dir: ./hostinger-public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            uploads/**
