version: '3.8'

services:
  client-bug-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: client_bug_tracker_app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - APP_URL=https://yourdomain.com
      - JWT_SECRET=change_me_to_a_secure_random_string_in_production
      - SLACK_WEBHOOK_URL=
      - EMAIL_PROVIDER=logger
      - EMAIL_FROM=support@yourdomain.com
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
